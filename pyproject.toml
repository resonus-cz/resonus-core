[project]
name = "resonus-core"
version = "0.11.1"
description = "Shared building blocks of the Re:sonus acoustics apps"
authors = [{ name = "David Jun" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "sounddevice", "h5py", "tomli-w", "PyGObject", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML", "nbclient", "nbformat", "ipykernel"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resonus_core*"]

[tool.setuptools.package-data]
resonus_core = ["py.typed", "assets/fonts/lexend/*", "assets/style_tokens.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]

[tool.mypy]
files = ["resonus_core", "tests"]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "gi", "gi.*", "sounddevice", "h5py", "cycler", "nbclient", "nbformat"]
ignore_missing_imports = true
